name: seal-build

# Build-and-pack only: the tests (grunt lint/build leg + the real QUnit suite in
# headless Chrome) run on Travis via .travis.yml.
on:
  workflow_dispatch:

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write container scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seal"
          # dist/cdn/* as written by makeReleaseCopies() in build/release.js
          # (only reachable through the interactive `grunt release`).
          cat > "$RUNNER_TEMP/seal/cdn-copies.js" <<'SEAL_CDN_EOF'
          var fs = require( "fs" ),
            version = require( process.cwd() + "/package.json" ).version,
            cdn = "dist/cdn",
            base = "jquery-" + version;
          if ( !fs.existsSync( cdn ) ) {
            fs.mkdirSync( cdn );
          }
          fs.writeFileSync( cdn + "/" + base + ".js", fs.readFileSync( "dist/jquery.js" ) );
          fs.writeFileSync( cdn + "/" + base + ".min.js",
            fs.readFileSync( "dist/jquery.min.js", "utf8" )
              .replace( /\/\/# sourceMappingURL=\S+/, "" ) );
          fs.writeFileSync( cdn + "/" + base + ".min.map",
            fs.readFileSync( "dist/jquery.min.map", "utf8" )
              .replace( /"file":"([^"]+)","sources":\["([^"]+)"\]/,
                "\"file\":\"" + base + ".min.js\",\"sources\":[\"" + base + ".js\"]" ) );
          console.log( "wrote " + fs.readdirSync( cdn ).join( ", " ) );
          SEAL_CDN_EOF
          cat > "$RUNNER_TEMP/seal/build.sh" <<'SEAL_BUILD_EOF'
          set -euo pipefail
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken 2014-05-01T17:15:20.164000Z
          # npm 2 only sends the token when always-auth is on
          npm config set always-auth true
          # build/tasks/build.js appends $COMMIT to the embedded version
          unset COMMIT
          node --version
          npm --version
          # Reproducibility pins. The uglify banner year is pinned in Gruntfile.js
          # itself; @DATE is pinned here because build/ edits cannot ship.
          if grep -q "grunt.template.today" Gruntfile.js; then
            echo "Gruntfile.js banner year is not pinned"
            exit 1
          fi
          sed -i 's|( new Date() ).toISOString().replace( /:\\d+\\.\\d+Z\$/, "Z" )|"2014-05-01T17:11Z"|' build/tasks/build.js
          if grep -q "new Date()" build/tasks/build.js; then
            echo "@DATE pin did not apply to build/tasks/build.js"
            exit 1
          fi
          grep -n '"2014-05-01T17:11Z"' build/tasks/build.js
          npm install
          # grunt default = jsonlint, build, jshint, jscs, uglify, dist, compare_size
          ./node_modules/.bin/grunt
          node /seal/cdn-copies.js
          ls -la dist dist/cdn
          # .npmignore does not list .github and npm 2 has no default rule for it
          rm -rf .github
          # npm 2 records each file's uid/gid in the tar entry
          chown -R "$HOST_UID:$HOST_GID" /work
          npm pack
          tar tzf jquery-2.1.1.tgz | sort
          echo "member count: $(tar tzf jquery-2.1.1.tgz | wc -l)"
          chown -R "$HOST_UID:$HOST_GID" /work
          SEAL_BUILD_EOF

      - name: Build and pack (node 0.10 / npm 2, grunt)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work \
            -v "$RUNNER_TEMP/seal":/seal \
            -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:0.10-wheezy bash /seal/build.sh
          ls -la jquery-2.1.1.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jquery-npm
          path: jquery-2.1.1.tgz
          if-no-files-found: error
