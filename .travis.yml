language: node_js
dist: focal
node_js:
- '0.10'
jobs:
  include:
    # Real QUnit unit suite (upstream ran it in browsers via TestSwarm) in
    # headless Chrome; dist/ is built with the project's own node 0.10 toolchain
    # (grunt default = jsonlint + build + jshint + jscs + uglify + dist).
    - node_js: '20'
      addons:
        chrome: stable
      install:
        - nvm install 0.10
        - nvm use 0.10
        - unset COMMIT
        - npm install
        - ./node_modules/.bin/grunt
        - nvm use 20
        - mkdir -p /tmp/driver
        - cd /tmp/driver && npm init -y && npm install puppeteer-core@22 && cd "$TRAVIS_BUILD_DIR"
        - if ! command -v php; then sudo apt-get update && sudo apt-get install -y php-cli; fi
        - php --version
        - google-chrome-stable --version
      before_script:
        # Multiple workers are load-bearing: single-process php -S starves the
        # fixture iframes the suite opens.
        - PHP_CLI_SERVER_WORKERS=10 php -S 127.0.0.1:8000 -t . > /tmp/php.log 2>&1 &
        - sleep 3
        - curl -sSf -o /dev/null http://127.0.0.1:8000/test/index.html
      script:
        # Environment-dependent in modern headless Chrome (not jQuery bugs):
        # Chrome forbids sync XHR during page unload; Blink snaps offsets to 1/64 px.
        - >-
          SEAL_SKIP_TESTS="ajax: #14379 - jQuery.ajax() on unload||offset: fractions (see #7730 and #7885)"
          CHROME_PATH="$(command -v google-chrome-stable)"
          NODE_PATH=/tmp/driver/node_modules
          node test/seal-browser-runner.js "http://127.0.0.1:8000/test/index.html?dev"
      after_failure:
        - tail -n 100 /tmp/php.log
